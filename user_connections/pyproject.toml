[project]
name = "user-connections"
version = "0.1.0"
description = "1-to-1 WebRTC calling demo: backend + signal server + alembic"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]
